<ion-refresher slot="fixed" (ionRefresh)="loadStats($event)">
  <ion-refresher-content pullingText="Tarik untuk memperbarui" refreshingSpinner="circles" refreshingText="Memuat statistik...">
  </ion-refresher-content>
</ion-refresher>

<section class="page-heading">
  <div class="heading-text">
    <h1>Dashboard</h1>
    <p>Ringkasan data &amp; statistik CMS</p>
  </div>
  <button type="button" class="refresh-btn" (click)="loadStats()" [disabled]="loading || refreshing" title="Perbarui Data">
    <ion-icon name="refresh-outline" [class.icon-spin]="loading || refreshing" aria-hidden="true"></ion-icon>
    {{ loading ? 'Memuat...' : refreshing ? 'Memperbarui...' : 'Perbarui' }}
  </button>
</section>

<!-- Error Banner (hanya muncul saat initial load gagal) -->
<div *ngIf="errorMessage" class="error-banner" role="alert">
  <div class="error-content">
    <ion-icon name="alert-circle-outline" class="error-icon" aria-hidden="true"></ion-icon>
    <span>{{ errorMessage }}</span>
  </div>
  <button type="button" class="retry-btn" (click)="loadStats()">Coba Lagi</button>
</div>

<!-- Skeleton: hanya tampil pada initial load (sebelum data pertama ada) -->
<section *ngIf="loading" class="stats-grid">
  <article class="stat-card skeleton" *ngFor="let i of [1,2,3,4]">
    <div class="stat-skeleton-icon">
      <ion-skeleton-text animated style="width: 52px; height: 52px; border-radius: 12px;"></ion-skeleton-text>
    </div>
    <div class="stat-skeleton-body">
      <ion-skeleton-text animated style="width: 65%; height: 14px; margin-bottom: 10px;"></ion-skeleton-text>
      <ion-skeleton-text animated style="width: 40%; height: 32px;"></ion-skeleton-text>
    </div>
  </article>
</section>

<!-- Grid Statistik: tampil setelah data pertama berhasil dimuat -->
<section *ngIf="!loading" class="stats-grid">
  <article class="stat-card card-news">
    <div class="stat-icon-wrapper">
      <ion-icon name="newspaper-outline" class="stat-icon" aria-hidden="true"></ion-icon>
    </div>
    <div class="stat-info">
      <span class="stat-label">Total Berita</span>
      <strong class="stat-value">{{ stats.totalNews }}</strong>
    </div>
  </article>

  <article class="stat-card card-products">
    <div class="stat-icon-wrapper">
      <ion-icon name="briefcase-outline" class="stat-icon" aria-hidden="true"></ion-icon>
    </div>
    <div class="stat-info">
      <span class="stat-label">Total Jasa / Produk</span>
      <strong class="stat-value">{{ stats.totalProducts }}</strong>
    </div>
  </article>

  <article class="stat-card card-categories">
    <div class="stat-icon-wrapper">
      <ion-icon name="pricetags-outline" class="stat-icon" aria-hidden="true"></ion-icon>
    </div>
    <div class="stat-info">
      <span class="stat-label">Total Kategori</span>
      <strong class="stat-value">{{ stats.totalCategories }}</strong>
    </div>
  </article>

  <article class="stat-card card-vendors">
    <div class="stat-icon-wrapper">
      <ion-icon name="business-outline" class="stat-icon" aria-hidden="true"></ion-icon>
    </div>
    <div class="stat-info">
      <span class="stat-label">Total Vendor</span>
      <strong class="stat-value">{{ stats.totalVendors }}</strong>
    </div>
  </article>
</section>

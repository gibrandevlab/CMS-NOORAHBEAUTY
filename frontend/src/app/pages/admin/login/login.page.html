<ion-header>
  <ion-toolbar>
    <ion-title>Login Admin</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div style="max-width: 400px; margin: 40px auto;">
    <h2>Masuk ke CMS Admin</h2>
    
    <div *ngIf="errorMessage" style="color: red; margin-bottom: 15px; padding: 10px; border: 1px solid red; background-color: #ffe6e6; border-radius: 4px;">
      {{ errorMessage }}
    </div>

    <form (ngSubmit)="onLogin()">
      <ion-item style="margin-bottom: 15px;">
        <ion-label position="stacked">Username</ion-label>
        <ion-input
          type="text"
          name="username"
          [(ngModel)]="username"
          placeholder="Masukkan username"
          required>
        </ion-input>
      </ion-item>

      <ion-item style="margin-bottom: 20px;">
        <ion-label position="stacked">Password</ion-label>
        <ion-input
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Masukkan password"
          required>
        </ion-input>
      </ion-item>

      <ion-button expand="block" type="submit" [disabled]="isLoading">
        <ion-spinner *ngIf="isLoading" name="crescent"></ion-spinner>
        <span *ngIf="!isLoading">Login</span>
      </ion-button>
    </form>
  </div>
</ion-content>

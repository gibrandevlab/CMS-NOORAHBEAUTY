<div class="admin-layout" [class.sidebar-open]="isSidebarOpen">
  <header class="admin-header">
    <div class="header-left">
      <!-- Tombol toggle untuk mobile -->
      <button
        type="button"
        class="mobile-toggle"
        aria-label="Buka menu navigasi"
        (click)="toggleSidebar()"
      >
        <ion-icon name="menu-outline"></ion-icon>
      </button>
      <a routerLink="/admin/dashboard" class="brand">
        <img src="assets/images/LOGO NB.png" alt="NB" class="brand-logo" />
        <span class="brand-title">NOORAHBEAUTY</span>
      </a>
    </div>

    <div class="header-right">
      <div class="user-profile-chip d-none d-sm-flex">
        <div class="user-avatar">A</div>
        <span class="user-name">Administrator</span>
      </div>
      <button type="button" class="logout-btn" (click)="logout()" title="Keluar dari Panel Admin">
        <ion-icon name="log-out-outline" aria-hidden="true"></ion-icon>
        <span>Logout</span>
      </button>
    </div>
  </header>

  <!-- Sidebar Menu -->
  <aside class="admin-sidebar" [class.open]="isSidebarOpen">
    <div class="sidebar-brand-mobile">
      <span class="brand text-white font-monospace">NOORAHBEAUTY</span>
    </div>
    <nav>
      <a routerLink="/admin/dashboard" routerLinkActive="active" class="nav-link">
        <ion-icon name="grid-outline" class="nav-icon"></ion-icon>
        <span>Dashboard</span>
      </a>

      <div class="nav-section">KELOLA MASTER</div>
      <a routerLink="/admin/kategori-jasa" routerLinkActive="active" class="nav-link">
        <ion-icon name="pricetags-outline" class="nav-icon"></ion-icon>
        <span>Kategori Jasa</span>
      </a>
      <a routerLink="/admin/jasa" routerLinkActive="active" class="nav-link">
        <ion-icon name="briefcase-outline" class="nav-icon"></ion-icon>
        <span>Layanan & Jasa</span>
      </a>
      <a routerLink="/admin/berita" routerLinkActive="active" class="nav-link">
        <ion-icon name="newspaper-outline" class="nav-icon"></ion-icon>
        <span>Berita & Artikel</span>
      </a>
      <a routerLink="/admin/vendor" routerLinkActive="active" class="nav-link">
        <ion-icon name="business-outline" class="nav-icon"></ion-icon>
        <span>Mitra Vendor</span>
      </a>

      <div class="nav-section">KONTEN TOKO</div>
      <a routerLink="/admin/tentang-kami" routerLinkActive="active" class="nav-link">
        <ion-icon name="information-circle-outline" class="nav-icon"></ion-icon>
        <span>Profil Tentang Kami</span>
      </a>

      <div class="nav-section">PENGATURAN</div>
      <a routerLink="/admin/users" routerLinkActive="active" class="nav-link">
        <ion-icon name="people-outline" class="nav-icon"></ion-icon>
        <span>User Admin</span>
      </a>

      <div class="nav-section">LIHAT TAMPILAN</div>
      <a routerLink="/beranda" target="_blank" class="nav-link public-link">
        <ion-icon name="open-outline" class="nav-icon"></ion-icon>
        <span>Website Publik</span>
      </a>
    </nav>
  </aside>

  <!-- Overlay background saat sidebar terbuka di mobile -->
  <div class="sidebar-overlay" *ngIf="isSidebarOpen" (click)="toggleSidebar()"></div>

  <main class="admin-content">
    <router-outlet></router-outlet>
  </main>
</div>
